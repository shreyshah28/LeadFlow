name: Daily Follow-up Email Cron

on:
  schedule:
    # 8:00 AM Asia/Kolkata (IST) = 02:30 UTC every day
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions console for testing

jobs:
  trigger-daily-followup:
    name: Send Daily Follow-up Email Summary
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LeadFlow Daily Email Endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is not set in GitHub repository secrets."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in GitHub repository secrets."
            exit 1
          fi

          # Strip any trailing slash from BACKEND_URL
          CLEAN_URL="${BACKEND_URL%/}"
          ENDPOINT="${CLEAN_URL}/api/cron/daily-followup"

          echo "Triggering LeadFlow daily follow-up summary at: $ENDPOINT"

          # Perform HTTP POST with Bearer authorization and 120s timeout (handles Render spin-up)
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -H "User-Agent: LeadFlow-GitHubAction-Cron/1.0" \
            --connect-timeout 60 \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5)

          BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | cut -d: -f2)

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Daily follow-up email trigger failed with HTTP status $HTTP_STATUS: $BODY"
            exit 1
          fi

          echo "Daily follow-up email trigger executed successfully."
